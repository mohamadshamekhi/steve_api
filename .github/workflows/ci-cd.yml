name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build -o /dev/null main.go

  deploy:
    name: deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: Deploy
        env:
          SERVER_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SERVER_IP: ${{ secrets.DEPLOY_SSH_HOST }}
          SERVER_PORT: ${{ secrets.DEPLOY_SSH_PORT || '22' }}
          REMOTE_ROOT: ${{ secrets.DEPLOY_PATH }}
        run: ./deploy.sh
