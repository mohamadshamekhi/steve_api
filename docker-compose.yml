version: '3.9' # یا ورژن جدیدتر موجود

services:
  mongodb:
    image: mongo:7.0
    container_name: my_mongo_db
    restart: unless-stopped
    ports:
      - "27017:27017" # پورت پیش‌فرض MongoDB
    volumes:
      - mongo_data:/data/db # برای ذخیره‌سازی دائمی داده‌های MongoDB


  redis:
    image: redis:8.0-alpine3.21
    container_name: my_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379" # پورت پیش‌فرض Redis
    volumes:
      - redis_data:/data # برای ذخیره‌سازی دائمی داده‌های Redis
    # command: redis-server --save 60 1 --loglevel warning # مثال برای تنظیمات Redis (اختیاری)

volumes:
  mongo_data: # تعریف volume برای MongoDB
    driver: local
  redis_data: # تعریف volume برای Redis
    driver: local