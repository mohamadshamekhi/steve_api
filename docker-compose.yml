services:
  app:
    image: ${IMAGE_TAG:-steve-api:latest}
    container_name: steve_app
    restart: unless-stopped
    ports:
      - "7777:7777"
    depends_on:
      - mongodb
      - redis
    environment:
      # frequently-rotated secrets, read from .env next to this file (see
      # .env.example). the rest of the app config (auth.sign_key, zarinpal
      # urls, media policies, mellipayamak url/patterns, schedulers, ...)
      # comes from the mounted config.yml below - matches the split that was
      # already running in production, kept as-is to avoid a behavior change.
      - ST_MONGO__PORT=27017
      - ST_MONGO__HOST=steve_db
      - ST_MONGO__USERNAME=${ST_MONGO__USERNAME}
      - ST_MONGO__PASSWORD=${ST_MONGO__PASSWORD}
      - ST_MONGO__DB_NAME=${ST_MONGO__DB_NAME}
      - ST_OBJECT_STORAGE__AWS_ACCESS_KEY_ID=${ST_OBJECT_STORAGE__AWS_ACCESS_KEY_ID}
      - ST_OBJECT_STORAGE__AWS_SECRET_ACCESS_KEY=${ST_OBJECT_STORAGE__AWS_SECRET_ACCESS_KEY}
      - ST_OBJECT_STORAGE__ENDPOINT=${ST_OBJECT_STORAGE__ENDPOINT}
      - ST_OBJECT_STORAGE__PUBLIC_BUCKET_NAME=${ST_OBJECT_STORAGE__PUBLIC_BUCKET_NAME}
      - ST_MELLIPAYAMAK__USERNAME=${ST_MELLIPAYAMAK__USERNAME}
      - ST_MELLIPAYAMAK__PASSWORD=${ST_MELLIPAYAMAK__PASSWORD}
      # MelliPayamak bodyId of the birthday_discount pattern ({0}=name {1}=code {2}=discount {3}=valid days)
      - ST_MELLIPAYAMAK__PATTERNS__BIRTHDAY_DISCOUNT=568773
      - ST_REDIS__PORT=6379
      - ST_REDIS__HOST=steve_cache
      - ST_ZARINPAL__MERCHANT_ID=${ST_ZARINPAL__MERCHANT_ID}
      - ST_TELEGRAM_BOT__ADMIN_API_TOKEN_BOT=${ST_TELEGRAM_BOT__ADMIN_API_TOKEN_BOT}
      - ST_TELEGRAM_BOT__DEVELOPER_API_TOKEN_BOT=${ST_TELEGRAM_BOT__DEVELOPER_API_TOKEN_BOT}
      - ST_TELEGRAM_BOT__ADMIN_CHAT_ID=${ST_TELEGRAM_BOT__ADMIN_CHAT_ID}
      - ST_TELEGRAM_BOT__DEVELOPER_CHAT_ID=${ST_TELEGRAM_BOT__DEVELOPER_CHAT_ID}
    volumes:
      # config.yml is NOT baked into the image (it holds real secrets and is
      # gitignored). It must exist next to this compose file on the server -
      # see deploy.sh / README for how it gets there on first deploy.
      - ./config.yml:/root/config.yml:ro
    networks:
      - steve_network

  mongodb:
    image: mongo:7.0
    container_name: steve_db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${ST_MONGO__USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${ST_MONGO__PASSWORD}
    ports:
      # bound to loopback only - reachable via `docker exec` or an SSH
      # tunnel for maintenance (mongodump etc.), not from the public internet
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - steve_network

  redis:
    image: redis:7.2-alpine
    container_name: steve_cache
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - steve_network


networks:
  steve_network:
    driver: bridge

# تعریف Volumeها برای ماندگاری داده‌ها
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
