version: '3.9'

services:
  app:
    build: .
    container_name: steve_app
    restart: unless-stopped
    ports:
      - "7777:7777"
    depends_on:
      - mongodb
      - redis
      - nats
    environment:
      - ST_MONGO__HOST=${ST_MONGO__HOST}
      - ST_MONGO__PORT=${ST_MONGO__PORT}
      - ST_MONGO__USERNAME=${ST_MONGO__USERNAME}
      - ST_MONGO__PASSWORD=${ST_MONGO__PASSWORD}
      - ST_MONGO__DB_NAME=${ST_MONGO__DB_NAME}
      - ST_OBJECT_STORAGE__AWS_ACCESS_KEY_ID=${ST_OBJECT_STORAGE__AWS_ACCESS_KEY_ID}
      - ST_OBJECT_STORAGE__AWS_SECRET_ACCESS_KEY=${ST_OBJECT_STORAGE__AWS_SECRET_ACCESS_KEY}
      - ST_OBJECT_STORAGE__ENDPOINT=${ST_OBJECT_STORAGE__ENDPOINT}
      - ST_OBJECT_STORAGE__PUBLIC_BUCKET_NAME=${ST_OBJECT_STORAGE__PUBLIC_BUCKET_NAME}
      - ST_MELLIPAYAMAK__USERNAME=${ST_MELLIPAYAMAK__USERNAME}
      - ST_MELLIPAYAMAK__PASSWORD=${ST_MELLIPAYAMAK__PASSWORD}
      - ST_REDIS__HOST=${ST_REDIS__HOST}
      - ST_REDIS__PORT=${ST_REDIS__PORT}
      - NATS_URL=nats://nats:4222
    networks:
      - steve_network

  mongodb:
    image: mongo:7.0
    container_name: my_mongo_db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - steve_network

  redis:
    image: redis:7.2-alpine
    container_name: my_redis_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - steve_network

  nats:
    image: nats:2.11.4-alpine3.21
    container_name: my_nats_server
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
    command: [
      "nats-server",
      "-js",
      "-sd", "/data/jetstream",
      "--http_port", "8222"
    ]
    volumes:
      - nats_jetstream_data:/data/jetstream
    networks:
      - steve_network

# تعریف شبکه‌ها
networks:
  steve_network:
    driver: bridge

# تعریف Volumeها برای ماندگاری داده‌ها
volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
  nats_jetstream_data:
    driver: local