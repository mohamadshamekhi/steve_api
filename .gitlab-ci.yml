image: docker:24.0.5

variables:
  # تنظیمات سرور
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "/home/ubuntu/projects/steve-app"
  SSH_PORT: "2222"
  ARVAN_ACCESS_KEY: "1c6b005e-9152-4b7e-9fff-31e24810ce0a"
  ARVAN_SECRET_KEY: "9211504b291a61243e8499610de4b1a8e12163a0c42091fcdd92cdda0626d7bf"
  ARVAN_ENDPOINT: "http://s3.ir-thr-at1.arvanstorage.ir"
  ARVAN_BUCKET: "soraa"


  # تنظیمات داکر
  IMAGE_TAG: "steve-app:latest"

stages:
  - deploy

deploy_job:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

  before_script:
    # 1. نصب ابزارهای ضروری (Rclone برای آپلود، SSH برای دستور به سرور)
    - apk add --no-cache openssh-client curl unzip

    # 2. نصب سریع Rclone
    - curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
    - unzip rclone-current-linux-amd64.zip
    - cp rclone-*-linux-amd64/rclone /usr/bin/
    - chmod 755 /usr/bin/rclone

    # 3. تنظیم SSH Key
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort 2222\n\n" > ~/.ssh/config

  script:
    # ---------------------------------------------------------
    # بخش ۱: آماده‌سازی و آپلود به آروان (در خارج)
    # ---------------------------------------------------------
    - echo "🏗️ Building Docker Image..."
    - docker build -t $IMAGE_TAG .

    - echo "📦 Compressing Image..."
    # تبدیل ایمیج به فایل فشرده (برای انتقال راحت‌تر)
    - docker save $IMAGE_TAG | gzip > image.tar.gz

    - echo "☁️ Configuring ArvanCloud S3..."
    # ساخت کانفیگ Rclone برای اتصال به آروان
    - |
      mkdir -p ~/.config/rclone
      cat > ~/.config/rclone/rclone.conf <<EOF
      [arvan]
      type = s3
      provider = arvan
      env_auth = false
      access_key_id = $ARVAN_ACCESS_KEY
      secret_access_key = $ARVAN_SECRET_KEY
      endpoint = $ARVAN_ENDPOINT
      acl = public-read
      EOF

    - echo "🚀 Uploading Files to Arvan S3..."
    # آپلود همزمان ایمیج و فایل کامپوز
    - rclone copy image.tar.gz arvan:$ARVAN_BUCKET/
    - rclone copy docker-compose.yml arvan:$ARVAN_BUCKET/

    # ---------------------------------------------------------
    # بخش ۲: دانلود و اجرا روی سرور (در ایران)
    # ---------------------------------------------------------
    - echo "📡 Connecting to Server for Deployment..."

    # لینک دانلود فایل‌ها (چون باکت عمومی است، لینک مستقیم کار میکند)
    - IMAGE_URL="$ARVAN_ENDPOINT/$ARVAN_BUCKET/image.tar.gz"
    - COMPOSE_URL="$ARVAN_ENDPOINT/$ARVAN_BUCKET/docker-compose.yml"

    # اجرای تمام دستورات در یک کانکشن SSH (روش پایدار)
    - ssh $SERVER_USER@$SERVER_IP "
      # 1. آماده‌سازی دایرکتوری
      mkdir -p $SERVER_PATH &&
      cd $SERVER_PATH &&
      
      echo '⬇️ Downloading Files from Arvan (Internal Network)...' &&
      # دانلود فایل‌ها (آپشن -O برای ذخیره روی فایل موجود)
      wget -q -O image.tar.gz '$IMAGE_URL' &&
      wget -q -O docker-compose.yml '$COMPOSE_URL' &&
      
      echo '⚙️ Writing Configs...' &&
      echo 'ST_MONGO__HOST=steve_db' > .env &&
      
      echo '🐳 Loading Docker Image...' &&
      # لود کردن ایمیج از فایل فشرده به داکر
      gunzip -c image.tar.gz | docker load &&
      
      echo '🔥 Restarting Services...' &&
      # اجرای نهایی
      docker compose up -d --remove-orphans &&
      docker image prune -f &&
      
      echo '✅ Deployment Successful!'
      "