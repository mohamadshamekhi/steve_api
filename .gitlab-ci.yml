image: docker:24.0.5

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  REGISTRY_URL: "5.78.55.0:5051"
  IMAGE_NAME: "5.78.55.0:5051/steve/backend/steve-go"
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "~/projects/steve-app"

stages:
  - build
  - deploy

build_job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - echo "🏗️ Building & Pushing Steve App..."
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 1.1.1.1" >> /etc/resolv.conf
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --insecure
      --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


deploy_job:
  stage: deploy
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
      # چون ریجیستری شما HTTP است، این خط برای رانر ضروری است
      command: ["--insecure-registry=5.78.55.0:5051"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    SSH_PORT: "2222" # پورت جدید SSH شما

  before_script:
    # نصب SSH Client روی رانر
    - apk update --no-cache && apk add --no-cache openssh-client

    # تنظیم کلید SSH
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort 2222\n\n" > ~/.ssh/config

  script:
    # ---------------------------------------------------------
    # بخش ۱: عملیات روی Runner (بیلد و آپلود به ریجیستری)
    # ---------------------------------------------------------
    - echo "🏗 Building & Pushing to Registry..."

    # لاگین به ریجیستری (از سمت رانر)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://${REGISTRY_URL}

    # پول کردن (برای کش)، بیلد و پوش
    - docker pull ${IMAGE_NAME}:latest || true
    - docker build --cache-from ${IMAGE_NAME}:latest -t ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} -t ${IMAGE_NAME}:latest .
    - docker push ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
    - docker push ${IMAGE_NAME}:latest

    # ---------------------------------------------------------
    # بخش ۲: عملیات روی Server (دستور دانلود و اجرا)
    # ---------------------------------------------------------
    - echo "🚀 Triggering Server to Pull & Run..."

    # انتقال فایل‌های سبک کانفیگ (هنوز لازمه)
    - REMOTE_DIR="/home/$SERVER_USER/projects/steve-app"
    - ssh $SERVER_USER@$SERVER_IP "mkdir -p $REMOTE_DIR"
    - echo "ST_MONGO__HOST=steve_db" > .env
    - scp .env $SERVER_USER@$SERVER_IP:$REMOTE_DIR/.env
    - scp docker-compose.yml $SERVER_USER@$SERVER_IP:$REMOTE_DIR/docker-compose.yml

    # دستور نهایی به سرور
    - ssh $SERVER_USER@$SERVER_IP "
      cd $REMOTE_DIR &&
      
      # لاگین در سمت سرور (خیلی مهم)
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin http://${REGISTRY_URL} &&
      
      # دانلود ایمیج (اینجاست که اون پروکسی به دادمون میرسه)
      echo '⬇️ Pulling Image...' &&
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
      docker compose pull &&
      
      # اجرا
      echo '🔥 Up and Running...' &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "