image: docker:24.0.5
services:
  - name: docker:24.0.5-dind
    alias: docker
variables:
  # تنظیمات سرور
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "/home/ubuntu/projects/steve-app"
  SSH_PORT: "2222"

  # تنظیمات آروان
  ARVAN_ACCESS_KEY: "1c6b005e-9152-4b7e-9fff-31e24810ce0a"
  ARVAN_SECRET_KEY: "9211504b291a61243e8499610de4b1a8e12163a0c42091fcdd92cdda0626d7bf"
  ARVAN_ENDPOINT: "https://s3.ir-thr-at1.arvanstorage.ir"
  ARVAN_BUCKET: "soraa"
  DOCKER_HOST: "tcp://localhost:2375"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "steve-app:$CI_COMMIT_SHORT_SHA"

stages:
  - deploy

deploy_job:
  stage: deploy
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/uk.alpinelinux.org/g' /etc/apk/repositories
    # نصب ابزارها
    - apk add --no-cache openssh-client curl unzip

    # نصب Rclone
    - curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
    - unzip -q rclone-current-linux-amd64.zip
    - cp rclone-*-linux-amd64/rclone /usr/bin/
    - chmod 755 /usr/bin/rclone

    # تنظیم SSH
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort $SSH_PORT\n\n" > ~/.ssh/config

  script:
    # ---------------------------------------------------------
    # 1. بیلد و فشرده‌سازی
    # ---------------------------------------------------------
    - echo "🏗️ Building Docker Image..."
    - docker build -t $IMAGE_TAG .

    - echo "📦 Compressing Image..."
    - docker save $IMAGE_TAG | gzip > image.tar.gz

    # ---------------------------------------------------------
    # 2. آپلود به آروان (Rclone)
    # ---------------------------------------------------------
    - echo "☁️ Configuring Rclone..."
    - |
      mkdir -p ~/.config/rclone
      cat > ~/.config/rclone/rclone.conf <<EOF
      [arvan]
      type = s3
      provider = Other
      env_auth = false
      access_key_id = $ARVAN_ACCESS_KEY
      secret_access_key = $ARVAN_SECRET_KEY
      endpoint = $ARVAN_ENDPOINT
      acl = public-read
      EOF

    - echo "🚀 Uploading Files to Arvan S3..."
    - rclone copy image.tar.gz arvan:$ARVAN_BUCKET/ --progress
    - rclone copy docker-compose.yml arvan:$ARVAN_BUCKET/ --progress

    # ---------------------------------------------------------
    # 3. اتصال به سرور و اجرا (SSH)
    # ---------------------------------------------------------
    - echo "📡 Deploying to Server..."
    - |
      ssh $SERVER_USER@$SERVER_IP "
        set -e # توقف اسکریپت در صورت بروز خطا

        # تعریف متغیرها داخل سرور
        REMOTE_DIR='$SERVER_PATH'
        IMG_URL='$ARVAN_ENDPOINT/$ARVAN_BUCKET/image.tar.gz'
        COMPOSE_URL='$ARVAN_ENDPOINT/$ARVAN_BUCKET/docker-compose.yml'

        echo '📂 Ensuring directory exists at: \$REMOTE_DIR'
        mkdir -p \$REMOTE_DIR
        cd \$REMOTE_DIR

        echo '⬇️ Downloading files...'
        wget -q -O image.tar.gz \$IMG_URL
        wget -q -O docker-compose.yml \$COMPOSE_URL

        echo '⚙️ Writing .env file...'
        echo 'ST_MONGO__HOST=steve_db' > .env

        echo '🐳 Loading Docker Image...'
        gunzip -c image.tar.gz | docker load

        echo '🔥 Restarting Services...'
        docker compose up -d --remove-orphans
        docker image prune -f

        echo '✅ Deployment Successful!'
      "