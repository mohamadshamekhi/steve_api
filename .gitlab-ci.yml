image: docker:24.0.5

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  REGISTRY_URL: "5.78.55.0:5051"
  IMAGE_NAME: "5.78.55.0:5051/steve/backend/steve-go"
  SERVER_IP: "5.161.134.214"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "~/projects/steve-app"

stages:
  - build
  - deploy

build_job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - echo "🏗️ Building & Pushing Steve App..."
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 1.1.1.1" >> /etc/resolv.conf
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --insecure
      --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


deploy_job:
  stage: deploy
  image: docker:24.0.5 # تغییر ایمیج به داکر (چون نیاز به دستورات داکر داریم)
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # ✅ تغییر میرور به Runflare (مخصوص Alpine)
    # نکته ۱: از آدرس /alpine استفاده کردیم نه /ubuntu
    # نکته ۲: از جداکننده | استفاده کردیم تا اسلش‌های آدرس قاطی نشوند
    - sed -i 's|dl-cdn.alpinelinux.org|mirror-linux.runflare.com/alpine|g' /etc/apk/repositories
    - sed -i 's|uk.alpinelinux.org|mirror-linux.runflare.com/alpine|g' /etc/apk/repositories

    # اگر باز هم ارور DNS دادید، این خط را آنکامنت کنید (IP ران‌فلر را باید پینگ بگیرید و جایگزین کنید)
    # فعلا نیازی نیست چون ران‌فلر معمولا خوب ریزالو می‌شود.

    # نصب پکیج‌ها
    - apk update --no-cache
    - apk add --no-cache openssh-client gzip

    # تنظیمات SSH
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "🚀 Pulling image on Runner (High Speed)..."
    # 1. لاگین در رجیستری (روی رانر)
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://${REGISTRY_URL}

    # 2. پول کردن ایمیج روی رانر (با سرعت بالا)
    - docker pull ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    # 3. ذخیره، فشرده‌سازی و ارسال مستقیم به سرور ایران
    - echo "📦 Zipping and Transferring to Iran Server..."
    - |
      docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} | gzip | \
      ssh $SERVER_USER@$SERVER_IP "cat > ${SERVER_PATH}/image.tar.gz"

    # 4. آماده‌سازی فایل env و کامپوز (مثل قبل)
    - ssh $SERVER_USER@$SERVER_IP "mkdir -p ${SERVER_PATH}"
    - echo "ST_MONGO__HOST=steve_db" > .env
    # ... (بقیه متغیرهای محیطی که داشتی رو اینجا بذار) ...
    - scp .env $SERVER_USER@$SERVER_IP:${SERVER_PATH}/.env
    - scp docker-compose.yml $SERVER_USER@$SERVER_IP:${SERVER_PATH}/docker-compose.yml

    # 5. لود کردن ایمیج در سرور مقصد و اجرا
    - echo "🚢 Loading & Running on Server..."
    - ssh $SERVER_USER@$SERVER_IP "
      cd ${SERVER_PATH} &&
      echo 'Unzipping and Loading Docker Image...' &&
      gunzip -c image.tar.gz | docker load &&
      rm image.tar.gz &&
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "