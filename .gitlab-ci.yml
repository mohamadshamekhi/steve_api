image: docker:24.0.5

variables:
  # تنظیمات کلی
  REGISTRY_URL: "5.78.55.0:5051"
  IMAGE_NAME: "5.78.55.0:5051/steve/backend/steve-go"
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "/home/ubuntu/projects/steve-app" # مسیر کامل (بدون ~) برای اطمینان
  SSH_PORT: "2222"

stages:
  - build
  - deploy

# -----------------------------------------------------------
# مرحله ۱: بیلد و پوش (با Kaniko - این مرحله سالم است)
# -----------------------------------------------------------
build_job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - echo "🏗️ Building & Pushing Steve App..."
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 1.1.1.1" >> /etc/resolv.conf

    # تنظیمات Kaniko
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json

    # اجرای بیلد و پوش
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --insecure
      --skip-tls-verify
      --cache=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# -----------------------------------------------------------
# مرحله ۲: دیپلوی (فقط دستور به سرور - بدون بیلد مجدد)
# -----------------------------------------------------------
deploy_job:
  stage: deploy
  image: alpine:latest  # استفاده از ایمیج سبک (چون فقط SSH می‌خواهیم)

  before_script:
    # نصب SSH Client
    - apk update --no-cache && apk add --no-cache openssh-client

    # تنظیم کلید SSH
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -

    # تنظیم کانفیگ SSH (پورت 2222)
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tPort 2222\n\n" > ~/.ssh/config

  script:
    - echo "🚀 Triggering Server to Pull & Run..."

    # ساخت دایرکتوری در سرور (با استفاده از متغیر SERVER_PATH)
    - ssh $SERVER_USER@$SERVER_IP "mkdir -p $SERVER_PATH"

    # ساخت فایل env و ارسال فایل‌های کانفیگ
    - echo "ST_MONGO__HOST=steve_db" > .env
    - scp .env $SERVER_USER@$SERVER_IP:$SERVER_PATH/.env
    - scp docker-compose.yml $SERVER_USER@$SERVER_IP:$SERVER_PATH/docker-compose.yml

    # اتصال به سرور و اجرای دستورات نهایی
    - ssh $SERVER_USER@$SERVER_IP "
      cd $SERVER_PATH &&
      
      echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin http://${REGISTRY_URL} &&
      
      echo '⬇️ Pulling Image...' &&
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
      docker compose pull &&
      
      echo '🔥 Up and Running...' &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "