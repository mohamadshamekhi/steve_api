image: docker:24.0.5

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  REGISTRY_URL: "5.78.55.0:5051"
  IMAGE_NAME: "5.78.55.0:5051/steve/backend/steve-go"
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "~/projects/steve-app"

stages:
  - build
  - deploy

build_job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - echo "🏗️ Building & Pushing Steve App..."
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 1.1.1.1" >> /etc/resolv.conf
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --insecure
      --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


deploy_job:
  stage: deploy
  image: docker:24.0.5 # تغییر ایمیج به داکر (چون نیاز به دستورات داکر داریم)
  services:
    - name: docker:24.0.5-dind
      # این دستور به داکر می‌گوید که به این آدرس با پروتکل HTTP اعتماد کن
      command: [ "--insecure-registry=5.78.55.0:5051" ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    SSH_PORT: "2222"
  before_script:
  # 1. میرورها
    - sed -i 's|dl-cdn.alpinelinux.org|mirror-linux.runflare.com|g' /etc/apk/repositories
    - sed -i 's|uk.alpinelinux.org|mirror-linux.runflare.com|g' /etc/apk/repositories

    # 2. نصب پکیج‌ها
    - apk update --no-cache
    - apk add --no-cache openssh-client gzip

    # 3. تنظیم کلید SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)

    # ✅ تغییر مهم: اضافه کردن یک خط جدید به انتهای کلید برای اطمینان
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | sed '$a\' | ssh-add -

    # 4. غیرفعال کردن چک اثر انگشت
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

  script:
    - echo "🔍 Debug: Testing Connection on Port $SSH_PORT..."
    # تست اتصال با پورت جدید
    - ssh -p $SSH_PORT -T $SERVER_USER@$SERVER_IP "echo '✅ Connection OK!'"

    - echo "🚀 Pulling image..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://${REGISTRY_URL}
    - docker pull ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    - echo "📦 Zipping..."
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} | gzip > image.tar.gz

    - echo "📤 Uploading (SCP)..."
    # نکته: scp از پورت -P (بزرگ) استفاده می‌کند
    - scp -P $SSH_PORT -o ServerAliveInterval=60 image.tar.gz $SERVER_USER@$SERVER_IP:${SERVER_PATH}/image.tar.gz

    # انتقال فایل‌های کانفیگ
    - echo "ST_MONGO__HOST=steve_db" > .env
    - scp -P $SSH_PORT .env $SERVER_USER@$SERVER_IP:${SERVER_PATH}/.env
    - scp -P $SSH_PORT docker-compose.yml $SERVER_USER@$SERVER_IP:${SERVER_PATH}/docker-compose.yml

    # اجرا
    - echo "🚢 Running..."
    - ssh -p $SSH_PORT $SERVER_USER@$SERVER_IP "
      cd ${SERVER_PATH} &&
      gunzip -c image.tar.gz | docker load &&
      rm image.tar.gz &&
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "