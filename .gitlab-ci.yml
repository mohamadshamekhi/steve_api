image: docker:24.0.5

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_DRIVER: overlay2
  REGISTRY_URL: "5.78.55.0:5051"
  IMAGE_NAME: "5.78.55.0:5051/steve/backend/steve-go"
  SERVER_IP: "37.32.4.62"
  SERVER_USER: "ubuntu"
  SERVER_PATH: "~/projects/steve-app"

stages:
  - build
  - deploy

build_job:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [ "" ]
  script:
    - echo "🏗️ Building & Pushing Steve App..."
    - echo "nameserver 8.8.8.8" > /etc/resolv.conf
    - echo "nameserver 1.1.1.1" >> /etc/resolv.conf
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${REGISTRY_URL}\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile"
      --destination "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      --destination "${IMAGE_NAME}:latest"
      --insecure
      --skip-tls-verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"


deploy_job:
  stage: deploy
  image: docker:24.0.5 # تغییر ایمیج به داکر (چون نیاز به دستورات داکر داریم)
  services:
    - name: docker:24.0.5-dind
      # این دستور به داکر می‌گوید که به این آدرس با پروتکل HTTP اعتماد کن
      command: [ "--insecure-registry=5.78.55.0:5051" ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    # ✅ تغییر میرور به Runflare (مخصوص Alpine)
    # نکته ۱: از آدرس /alpine استفاده کردیم نه /ubuntu
    # نکته ۲: از جداکننده | استفاده کردیم تا اسلش‌های آدرس قاطی نشوند
    - sed -i 's|dl-cdn.alpinelinux.org|mirror-linux.runflare.com|g' /etc/apk/repositories
    - sed -i 's|uk.alpinelinux.org|mirror-linux.runflare.com|g' /etc/apk/repositories
    # اگر باز هم ارور DNS دادید، این خط را آنکامنت کنید (IP ران‌فلر را باید پینگ بگیرید و جایگزین کنید)
    # فعلا نیازی نیست چون ران‌فلر معمولا خوب ریزالو می‌شود.

    # نصب پکیج‌ها
    - apk update --no-cache
    - apk add --no-cache openssh-client gzip

    # تنظیمات SSH
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
  script:
    - echo "🚀 Pulling image on Runner..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin http://${REGISTRY_URL}
    - docker pull ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}

    # ✅ گام ۱: ذخیره و فشرده‌سازی روی دیسک خود رانر (امن‌تر از پایپ مستقیم)
    - echo "📦 Saving & Zipping locally..."
    - docker save ${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} | gzip > image.tar.gz

    # ✅ گام ۲: ایجاد دایرکتوری در سرور مقصد
    - ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=5 $SERVER_USER@$SERVER_IP "mkdir -p ${SERVER_PATH}"

    # ✅ گام ۳: آپلود فایل با تنظیمات ضد قطعی (KeepAlive)
    # آپشن ServerAliveInterval=60 باعث می‌شود هر ۶۰ ثانیه یک سیگنال بفرستد تا کانکشن قطع نشود
    - echo "📤 Uploading to Iran Server (This may take a while)..."
    - scp -o ServerAliveInterval=60 -o ServerAliveCountMax=10 image.tar.gz $SERVER_USER@$SERVER_IP:${SERVER_PATH}/image.tar.gz

    # انتقال فایل‌های کانفیگ
    - echo "ST_MONGO__HOST=steve_db" > .env
    # ... (بقیه متغیرهای محیطی که داشتید) ...
    - scp -o ServerAliveInterval=60 .env $SERVER_USER@$SERVER_IP:${SERVER_PATH}/.env
    - scp -o ServerAliveInterval=60 docker-compose.yml $SERVER_USER@$SERVER_IP:${SERVER_PATH}/docker-compose.yml

    # ✅ گام ۴: لود کردن و اجرا در سرور
    - echo "🚢 Loading & Running on Server..."
    - ssh -o ServerAliveInterval=60 $SERVER_USER@$SERVER_IP "
      cd ${SERVER_PATH} &&
      echo 'Unzipping and Loading Docker Image...' &&
      gunzip -c image.tar.gz | docker load &&
      rm image.tar.gz &&
      export IMAGE_TAG=$CI_COMMIT_SHORT_SHA &&
      docker compose up -d --remove-orphans &&
      docker image prune -f
      "