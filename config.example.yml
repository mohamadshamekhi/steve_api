type: yml

http_server:
  port: 7777

redis:
  port: 6379
  host: localhost
  db: 0
  password: ""

backoffice:
  prefix: backoffice

user:
  prefix: user


auth:
  expiration_time_opt_code: 5m
  sign_key: test
  expiration_time_otp_context: 35s

mongo:
  host: 127.0.0.1
  username: "root"
  password: "password"
  port: 27017
  db_name: "steve"

media:
  public_base_url: "https://s3.ir-thr-at1.arvanstorage.ir"
  allowed_extensions:
    - "mp4"
    - "png"
    - "jpg"
    - "jpeg"
    - "webp"
    - "avi"
    - "webm"
  max_upload_size: 5242880 # 5 MB
  presigned_private_url_expiration: "30m"
  presigned_public_url_expiration: "168h"
  allowed_mime_types:
    - "video/mp4"
    - "image/png"
    - "image/jpeg"
    - "image/webp"


  policies:
    backoffice:
      max_upload_size: 524288000   # 500MB
      allowed_mime_types:
        - "video/mp4"
        - "image/png"
        - "image/jpeg"
        - "image/webp"
    user:
      max_upload_size: 5242880     # 5MB
      allowed_mime_types:
        - "image/png"
        - "image/jpeg"
        - "image/webp"

mellipayamak:
    username:
    password:
    url: "https://api.payamak-panel.com/post/Send.asmx"
    patterns:
      otp : "422053"
      payment : "428066"
      backoffice : "446054"
      birthday_discount : "568773"
      # {0}=name {1}=order id {2}=tracking code — bodyId of the order_shipped pattern
      order_shipped : "572257"
      # {0}=event title {1}=name {2}=phone {3}=detail {4}=date & time — sent to every super_admin
      admin_notify : "572270"
    from_number: "50002710070797"

payment:
  callback_url: "https://stevemobile.com/payment"
  gateway: "zarinpal"
  expiration_time_payment_sms_context: 35s
  expiration_time_payment_msg_telegram_context: 35s
  retry_count : 2
  retry_delay_time : 5s

zarinpal:
  currency: "IRT"
  merchant_id:
  verify_url: https://payment.zarinpal.com/pg/v4/payment/verify.json
  start_pay_url: https://payment.zarinpal.com/pg/StartPay
  request_url: https://payment.zarinpal.com/pg/v4/payment/request.json

order_scheduler:
  cancel_expired_pending_orders_time: 15m
  order_scheduler_cycle_time : 1m

cart_scheduler:
  cancel_expired_pending_carts_time: 168h
  cart_scheduler_cycle_time: 10m

# Defaults only — admins override these in the backoffice (/backoffice/birthday/settings).
birthday:
  enabled: true
  days_before: 3
  send_hour: 10 # Tehran hour the day's codes/SMS go out
  discount_type: "fixed_amount"
  discount_value: 500000
  valid_days: 10

birthday_scheduler:
  run_at: "0 * * * *" # hourly check; send hour is set in the backoffice

telegram_bot:
  admin_chat_id : 81390028
  developer_chat_id : 81390028